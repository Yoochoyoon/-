<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>진행자 - 집중표적게임</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="screen">
    <h1>진행자 화면</h1>

    <div id="createSection" class="card">
      <button id="createRoomBtn">방 만들기</button>
    </div>

    <div id="lobbySection" class="card" style="display:none">
      <h2>방 코드: <span id="roomCode"></span></h2>
      <p class="muted">플레이어들은 /player 에서 이 코드로 입장합니다.</p>
      <ul id="playerList" class="player-list"></ul>
      <button id="startBtn" disabled>시작 (8명 필요)</button>
    </div>

    <div id="gameSection" class="card" style="display:none">
      <h2 id="phaseLabel"></h2>
      <div class="timer" id="timerLabel">--:--</div>
      <ul id="gamePlayerList" class="player-list"></ul>
      <button id="advanceBtn">다음 단계로 (강제 진행)</button>
      <button id="extendBtn" class="secondary">시간 연장 (+1분)</button>
    </div>

    <div id="overSection" class="card" style="display:none">
      <h2>게임 종료</h2>
      <p id="winnerLabel"></p>
    </div>

    <p class="error" id="errorLabel"></p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared.js"></script>
  <script src="/host.js"></script>
</body>
</html>
